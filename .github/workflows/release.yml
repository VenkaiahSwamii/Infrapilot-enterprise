name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Generate changelog
      id: changelog
      run: |
        echo "Generating changelog from last tag..."
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          echo "No previous tag found, generating full changelog..."
          git log --pretty=format:"- %s (%h)" > CHANGELOG.md
        else
          git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" > CHANGELOG.md
        fi
        cat CHANGELOG.md >> $GITHUB_OUTPUT
      shell: bash

    - name: Generate release notes
      id: release_notes
      run: |
        cat <<EOF > release_notes.md
        ## Installation
        
        ### Docker Compose
        \`\`\`bash
        docker compose up -d
        \`\`\`
        
        ### Kubernetes
        \`\`\`bash
        helm repo add infrapilot https://charts.infrapilot.io
        helm install infrapilot infrapilot/infrapilot
        \`\`\`
        
        ## Docker Images
        - Backend: \`ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}\`
        - Frontend: \`ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}\`
        - Agent: \`ghcr.io/${{ github.repository }}/agent:${{ github.ref_name }}\`
        
        ## What's Changed
        ${{ steps.changelog.outputs.changelog }}
        
        ## Checksums
        \`\`\`
        Backend: \`docker pull ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}\`
        Frontend: \`docker pull ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}\`
        Agent: \`docker pull ghcr.io/${{ github.repository }}/agent:${{ github.ref_name }}\`
        \`\`\`
        EOF
        cat release_notes.md
      shell: bash

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release_notes.md
        body_path: release_notes.md
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Package Helm chart
      run: |
        echo "Packaging Helm chart..."
        helm package ./helm/infrapilot --destination ./helm-packages
        echo "Helm chart packaged successfully"
      
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          helm-packages/*.tgz
        if: always()

    - name: Deploy to production with version tag
      run: |
        echo "Deploying release ${{ github.ref_name }} to production..."
        helm upgrade --install infrapilot ./helm/infrapilot \
          --namespace infrapilot \
          --values helm/infrapilot/values-prod.yaml \
          --set image.tag=${{ github.ref_name }} \
          --set image.backend=ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }} \
          --set image.frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }} \
          --set image.agent=ghcr.io/${{ github.repository }}/agent:${{ github.ref_name }} \
          --timeout 5m \
          --wait
      
    - name: Verify production deployment
      run: |
        kubectl rollout status deployment/infrapilot-backend -n infrapilot --timeout=300s
        kubectl rollout status deployment/infrapilot-frontend -n infrapilot --timeout=300s
        kubectl get pods -n infrapilot

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [release]
    if: always()

    steps:
    - name: Send Slack notification
      uses: slackapi/slack-github-action@v1
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "InfraPilot Release: ${{ job.status }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*InfraPilot Enterprise Release*\nStatus: *${{ job.status }}*\nVersion: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Changes:*\n${{ steps.changelog.outputs.changelog }}"
                }
              }
            ]
          }