name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test backend
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: backend/go.sum
    
    - name: Verify dependencies
      run: go mod verify
      working-directory: ./backend
    
    - name: Run linter
      uses: golangci/golangci-lint-action@v6
      with:
        working-directory: backend
        version: latest
    
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      working-directory: ./backend
    
    - name: Check coverage
      run: go tool cover -func=coverage.out
      working-directory: ./backend
    
    - name: Build binary
      run: go build -ldflags='-w -s' -o infrapilot-server ./cmd/api
      working-directory: ./backend
    
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/coverage.out

  # Build and test frontend
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend
    
    - name: Run linter
      run: npm run lint 2>/dev/null || echo "No linter configured"
      working-directory: ./frontend
    
    - name: Run tests
      run: npm test 2>/dev/null || echo "No tests configured"
      working-directory: ./frontend
    
    - name: Build
      run: npm run build
      working-directory: ./frontend
    
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

  # Build and test agent
  agent:
    name: Agent Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: agent/go.sum
    
    - name: Verify dependencies
      run: go mod verify
      working-directory: ./agent
    
    - name: Run linter
      uses: golangci/golangci-lint-action@v6
      with:
        working-directory: agent
        version: latest
    
    - name: Run tests
      run: go test -v -race ./...
      working-directory: ./agent
    
    - name: Build cross-platform binaries
      run: |
        mkdir -p dist
        GOOS=linux GOARCH=amd64 go build -ldflags='-w -s' -o dist/agent-linux-amd64 ./cmd/agent
        GOOS=linux GOARCH=arm64 go build -ldflags='-w -s' -o dist/agent-linux-arm64 ./cmd/agent
        GOOS=darwin GOARCH=amd64 go build -ldflags='-w -s' -o dist/agent-darwin-amd64 ./cmd/agent
        GOOS=darwin GOARCH=arm64 go build -ldflags='-w -s' -o dist/agent-darwin-arm64 ./cmd/agent
        GOOS=windows GOARCH=amd64 go build -ldflags='-w -s' -o dist/agent-windows-amd64.exe ./cmd/agent
      working-directory: ./agent
    
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: agent-binaries
        path: agent/dist/

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      continue-on-error: true
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

  # Docker build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, agent]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: backend/Dockerfile.backend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: frontend/Dockerfile.frontend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push agent
      uses: docker/build-push-action@v5
      with:
        context: .
        file: agent/Dockerfile.agent
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max