name: Docker Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: backend/Dockerfile.backend
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/backend:latest
          ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.sha_short }}
          ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.repository.updated_at }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: frontend/Dockerfile.frontend
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/frontend:latest
          ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.sha_short }}
          ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.repository.updated_at }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push agent image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: agent/Dockerfile.agent
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/agent:latest
          ghcr.io/${{ github.repository }}/agent:${{ steps.meta.outputs.sha_short }}
          ghcr.io/${{ github.repository }}/agent:${{ steps.meta.outputs.version }}
        labels: |
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.repository.updated_at }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate SBOM for backend
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'image'
        image-ref: ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.sha_short }}
        format: 'cyclonedx'
        output: 'backend-sbom.xml'

    - name: Generate SBOM for frontend
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'image'
        image-ref: ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.sha_short }}
        format: 'cyclonedx'
        output: 'frontend-sbom.xml'

    - name: Upload SBOMs
      uses: actions/upload-artifact@v4
      with:
        name: sboms
        path: |
          backend-sbom.xml
          frontend-sbom.xml
      if: always()