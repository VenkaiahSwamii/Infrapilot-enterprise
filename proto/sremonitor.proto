syntax = "proto3";

package sremonitor;

option go_package = "infrapilot/backend/internal/proto/sremonitor;sremonitor";

// SREMonitorIngester Service definition for high-performance bi-directional streaming
service SREMonitorIngester {
  // Bi-directional streaming RPC: Agent streams telemetry & receives server control commands
  rpc BiStreamTelemetry (stream SREBatchPayload) returns (stream ServerCommandControl);
  
  // Historical query RPC for audit events and telemetry range metrics
  rpc GetTelemetryHistory (SREHistoryRequest) returns (SREHistoryResponse);
}

message SREBatchPayload {
  bytes raw_batch = 1;
  string signature = 2; // HMAC-SHA256 payload signature
  string machine_id = 3;
  int64 timestamp_ms = 4;
}

message SRETelemetryRequestList {
  repeated SRETelemetryPayload requests = 1;
}

message SRETelemetryPayload {
  int64 timestamp_ms = 1;
  string machine_id = 2;
  string hostname = 3;
  string api_key = 4;

  oneof payload {
    SystemMetric metric = 5;
    RemediationEvent event = 6;
    LogEntry log = 7;
  }
}

message SystemMetric {
  double cpu_percent = 1;
  int64 memory_used_mb = 2;
  int64 memory_total_mb = 3;
  double agent_cpu_percent = 4;
  int64 agent_memory_mb = 5;
  map<string, double> disk_usage_percent = 6;
  repeated ProcessMetric processes = 7;
  map<string, int32> service_status = 8;
  map<string, DiskIOMetric> disk_io_stats = 9;
}

message DiskIOMetric {
  double read_bytes_per_sec = 1;
  double write_bytes_per_sec = 2;
  double read_iops = 3;
  double write_iops = 4;
}

message ProcessMetric {
  int32 pid = 1;
  string service_name = 2;
  double cpu_percent = 3;
  int64 memory_mb = 4;
}

message RemediationEvent {
  string event_type = 1;     // e.g. "SERVICE_CRASH", "DISK_EXHAUSTION", "LATENCY_SPIKE"
  string target = 2;         // e.g. "ssh.service", "/tmp"
  string action_taken = 3;   // e.g. "Restarted service", "Cleaned 500MB volatile cache"
  bool success = 4;
  string error_message = 5;
  string phase = 6;          // "TRIGGERED", "ATTEMPTING", "COMPLETED", "FAILED"
  double agent_cpu_percent = 7;
  int64 agent_memory_mb = 8;
}

message LogEntry {
  string service_name = 1;
  string level = 2;          // "INFO", "WARN", "ERROR"
  string message = 3;        // PII scrubbed log entry
}

message ServerCommandControl {
  string command_id = 1;
  string action = 2;         // "EXECUTE_COMMAND", "SET_INTERVAL", "RESTART_SERVICE"
  string target = 3;
  string payload = 4;
  int64 issued_at = 5;
}

message SREHistoryRequest {
  string machine_id = 1;
  int64 since_ms = 2;
  int64 until_ms = 3;
}

message SREHistoryResponse {
  repeated RemediationEvent events = 1;
  repeated SystemMetric metrics = 2;
}
